[package]
name = "texflow"
version = "0.1.0"
description = "TexFlow — local-first LaTeX IDE"
authors = ["TexFlow"]
license = "MIT"
repository = "https://github.com/iang06112005/Leaf"
edition = "2021"
rust-version = "1.77"

[lib]
name = "texflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
